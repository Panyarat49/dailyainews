name: daily-ai-news briefs (Actions backup)

# Always-on BACKUP host for the dailyainews routine. The primary host is a local
# Desktop scheduled task (~07:11 Asia/Bangkok). This workflow runs ~2h later and only
# BACKFILLS briefs the local run didn't produce (e.g. the PC was off) — so it never
# double-runs or double-emails.
#
# Self-contained on purpose: it commits with the repo's own GITHUB_TOKEN and emails the
# briefs ITSELF (a GITHUB_TOKEN push does not trigger email-notify.yml). No Claude GitHub
# App and no PAT are needed. Secrets used: CLAUDE_CODE_OAUTH_TOKEN + MAIL_* (already set).

on:
  schedule:
    - cron: "37 2 * * *"        # 02:37 UTC = 09:37 Asia/Bangkok (after the local 07:11 run)
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's briefs already exist (true/false)"
        required: false
        default: "false"

concurrency:
  group: daily-ai-briefs-actions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run (gap-fill only)
        id: check
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          A="articles/${TODAY}-ainews.md"; W="articles/${TODAY}-watchlist.md"
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ -f "$A" ] && [ -f "$W" ]; then
            echo "Both briefs already exist for ${TODAY} (local host ran) — nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Backfilling: ainews exists=$([ -f "$A" ] && echo yes || echo no), watchlist exists=$([ -f "$W" ] && echo yes || echo no)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.check.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup Python (email)
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install email deps
        if: steps.check.outputs.run == 'true'
        run: pip install --quiet markdown

      - name: Generate missing brief(s)
        if: steps.check.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Mint one with 'claude setup-token' and add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          claude -p "$(cat .github/prompts/daily-brief.md)" \
            --model claude-opus-4-8 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,WebSearch,WebFetch,Glob,Grep" \
            2>&1 | tee claude-run.log

      - name: Commit, push, email
        if: steps.check.outputs.run == 'true'
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY="${{ steps.check.outputs.today }}"
          git config user.name  "dailyainews-actions-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          declare -A DIR=( [ainews]=daily-ai-news [watchlist]=daily-ai-watchlist )
          PRODUCED=()
          for kind in ainews watchlist; do
            B="articles/${TODAY}-${kind}.md"
            [ -f "$B" ] || continue
            d=".claude/skills/${DIR[$kind]}/reference"
            git add "$B"
            [ -f "$d/sources.md" ] && git add "$d/sources.md" || true
            [ -f "$d/perspectives.md" ] && git add "$d/perspectives.md" || true
            if git diff --cached --quiet; then continue; fi
            verify=webfetch
            if [ -f "$d/sources.md" ] && grep -q "WEBFETCH_BLOCKED" "$d/sources.md"; then verify=search; fi
            git commit -q -m "brief: ${TODAY} [kind=${kind}] [verify=${verify}] [host=actions]"
            PRODUCED+=("$kind")
          done

          if [ ${#PRODUCED[@]} -eq 0 ]; then echo "No new briefs to commit."; exit 0; fi

          # push (GITHUB_TOKEN); retry once via rebase if the remote moved
          if ! git push; then
            git pull --rebase && git push
          fi
          SHA="$(git rev-parse HEAD)"

          # email each produced brief (GITHUB_TOKEN push does NOT trigger email-notify.yml)
          if [ -z "${MAIL_USERNAME:-}" ] || [ -z "${MAIL_PASSWORD:-}" ] || [ -z "${MAIL_TO:-}" ]; then
            echo "::warning::MAIL_* not all set — briefs committed but not emailed."
            exit 0
          fi
          for kind in "${PRODUCED[@]}"; do
            B="articles/${TODAY}-${kind}.md"
            PERMALINK="https://github.com/${GH_REPO}/blob/${SHA}/${B}"
            echo "Emailing ${B} ..."
            python3 .github/scripts/send_email.py "$B" "$PERMALINK"
          done

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-run-log
          path: claude-run.log
          if-no-files-found: ignore
          retention-days: 14
