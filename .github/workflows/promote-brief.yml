name: Promote brief to main

# Copies any new brief files from claude/* branches to main, so the
# email-notify workflow triggers automatically after each routine run.

on:
  push:
    branches: ['claude/**']
    paths:
      - 'articles/*-ainews.md'
      - 'articles/*-watchlist.md'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_PAT }}

      - name: Find changed brief files
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          BRIEF_RE='^articles/[0-9]{4}-[0-9]{2}-[0-9]{2}-(ainews|watchlist)\.md$'

          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git show --name-only --format= "${AFTER}" | grep -E "$BRIEF_RE" || true)
          else
            FILES=$(git diff --name-only "${BEFORE}" "${AFTER}" | grep -E "$BRIEF_RE" || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No brief files detected — skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Brief files to promote: $FILES"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "files=$(echo "$FILES" | paste -sd' ' -)" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote to main
        if: steps.find.outputs.found == 'true'
        env:
          FILES: ${{ steps.find.outputs.files }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main

          # If any of today's brief files already exist on main, this is a re-run
          # (e.g. context reset spawned a second session). Suppress email on the
          # second promote so the reader isn't spammed with duplicate deliveries.
          ALREADY_ON_MAIN=false
          for f in $FILES; do
            if [ -f "$f" ]; then
              ALREADY_ON_MAIN=true
              break
            fi
          done

          for f in $FILES; do
            git checkout "${SOURCE_SHA}" -- "$f"
            echo "Copied: $f"
          done

          if git diff --cached --quiet; then
            echo "Content identical to main — nothing to commit."
            exit 0
          fi

          if [ "$ALREADY_ON_MAIN" = "true" ]; then
            COMMIT_MSG="brief: promote ${SOURCE_BRANCH} → main [skip email]"
            echo "Briefs already existed on main — suppressing duplicate email delivery."
          else
            COMMIT_MSG="brief: promote ${SOURCE_BRANCH} → main"
          fi

          git commit -m "$COMMIT_MSG"
          git push origin main
